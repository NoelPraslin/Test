function budget(){const paid={},owe={};let tot=0;const ids=PL().map(p=>p.id);ids.forEach(i=>paid[i]=owe[i]=0);

 return{paid,owe,tot,tr}}

function vStore(){
 const its=L(D.shop).filter(i=>!i.exp),todo=its.filter(i=>!i.done),done=its.filter(i=>i.done);
 const row=i=>{const rs=sRec(i),q=rs.length?rs.map(r=>sQty(i,r)).filter(Boolean).join(" + "):sQty(i,"");return`<label class="st-it ${i.done?"done":""}"><input type="checkbox" data-p="shop/${i.id}/done" data-chk="1" ${i.done?"checked":""}><span>${esc(i.name)}${q?` <small>× ${esc(q)}</small>`:""}</span></label>`};
 return`<div class="row" style="margin-bottom:10px"><button class="g" data-act="store" data-v="0">← Quitter</button><b class="grow" style="text-align:right">${todo.length} à acheter</b></div>${todo.map(row).join("")||'<div class="card empty">Tout est dans le caddie 🎉</div>'}${done.length?`<div class="sub" style="margin:14px 0 6px">Déjà pris (${done.length})</div>${done.map(row).join("")}`:""}`}
